<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Its Podomoro</title>
  <meta name="description" content="Its Podomoro - Minimalist Aesthetic Focus Timer.">
  
  <!-- Favicon Tab Icon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-cyberpunk">

  <!-- Interactive Organic Canvas Motion Layer (9 Motion Scenes) -->
  <div id="bg-container">
    <canvas id="bg-canvas"></canvas>
    <div class="bg-overlay"></div>
  </div>

  <!-- Main App Shell -->
  <div id="app">

    <!-- Top Navigation Header -->
    <header class="navbar-minimal">
      <div class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-stopwatch"></i>
        </div>
        <span class="logo-text">ITS<span class="highlight">PODOMORO</span></span>
      </div>

      <!-- Clean Header Quick Actions -->
      <div class="header-minimal-actions">
        <!-- Streak Display -->
        <div class="stat-pill" title="Daily Streak">
          <i class="fa-solid fa-fire streak-flame"></i>
          <span id="streak-count">0</span>
        </div>

        <!-- Master Control Button -->
        <button class="icon-btn master-menu-btn" id="btn-master-menu" title="Open Controls">
          <i class="fa-solid fa-sliders"></i>
        </button>

        <!-- Clean Screen / Zen Mode Toggle -->
        <button class="icon-btn" id="btn-zen-mode" title="Clean Screen">
          <i class="fa-solid fa-eye-slash"></i>
        </button>
      </div>
    </header>

    <!-- Center Timer Card -->
    <main class="main-content-centered">
      
      <div class="timer-card glass-card">

        <!-- Mode Switcher Tabs -->
        <div class="mode-tabs">
          <button class="mode-btn active" data-mode="pomodoro">Focus</button>
          <button class="mode-btn" data-mode="shortBreak">Short Break</button>
          <button class="mode-btn" data-mode="longBreak">Long Break</button>
        </div>

        <!-- Glowing Circular Progress Ring -->
        <div class="timer-display-wrapper">
          <svg class="progress-ring" width="340" height="340" viewBox="0 0 340 340">
            <circle class="progress-ring__background" stroke="rgba(255, 255, 255, 0.06)" stroke-width="10" fill="transparent" r="150" cx="170" cy="170"/>
            <circle class="progress-ring__circle" stroke="url(#ring-gradient)" stroke-width="12" stroke-linecap="round" fill="transparent" r="150" cx="170" cy="170"/>
            <defs>
              <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--accent-color)" />
                <stop offset="100%" stop-color="var(--accent-secondary)" />
              </linearGradient>
            </defs>
          </svg>

          <!-- Inner Clock Display -->
          <div class="timer-inner">
            <div class="timer-time" id="timer-display">25:00</div>
            <div class="session-round-dots" id="session-dots">
              <span class="dot active"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>

        <!-- Main Timer Controls -->
        <div class="timer-controls">
          <button class="btn-control btn-secondary" id="btn-reset" title="Reset">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
          <button class="btn-control btn-main" id="btn-start">
            <i class="fa-solid fa-play" id="start-icon"></i>
            <span id="start-btn-text">START</span>
          </button>
          <button class="btn-control btn-secondary" id="btn-skip" title="Skip">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

      </div>

    </main>

    <!-- Floating Clean Bottom Task Bar -->
    <div class="task-bar-floating glass-card" id="task-bar-container">
      <div class="task-bar-header">
        <div class="task-bar-title">
          <i class="fa-solid fa-list-check"></i>
          <span>Tasks (<span id="completed-tasks-count">0</span>/<span id="total-tasks-count">0</span>)</span>
        </div>
        <button class="btn-toggle-task-panel" id="btn-toggle-task-panel">
          <i class="fa-solid fa-chevron-up" id="task-chevron"></i>
        </button>
      </div>

      <div class="task-panel-content hidden" id="task-panel-content">
        <form id="add-task-form" class="task-form">
          <div class="input-group">
            <input type="text" id="task-title-input" placeholder="Add task..." required autocomplete="off">
            <button type="submit" class="btn-add-task">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </form>

        <ul class="task-list" id="task-list">
          <!-- Dynamic Tasks -->
        </ul>
      </div>
    </div>

  </div>

  <!-- Master Controls Drawer -->
  <div class="modal-overlay" id="modal-master">
    <div class="modal-box glass-card master-drawer">
      <div class="modal-header">
        <h2><i class="fa-solid fa-sliders"></i> Controls</h2>
        <button class="btn-close-modal" id="btn-close-master"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body master-body">
        
        <div class="master-tabs">
          <button class="master-tab active" data-tab="tab-themes"><i class="fa-solid fa-palette"></i> 9 Themes</button>
          <button class="master-tab" data-tab="tab-audio"><i class="fa-solid fa-volume-high"></i> Ambience</button>
          <button class="master-tab" data-tab="tab-timer"><i class="fa-solid fa-clock"></i> Durations</button>
        </div>

        <!-- TAB 1: 9 Dynamic Motion Themes (Original 6 + 3 New) -->
        <div class="master-tab-content active" id="tab-themes">
          <div class="theme-grid">
            <div class="theme-card active" data-theme="cyberpunk">
              <div class="theme-preview theme-cyberpunk-preview"></div>
              <div class="theme-info"><h4>1. Cyber Neon</h4></div>
            </div>

            <div class="theme-card" data-theme="galaxy">
              <div class="theme-preview theme-galaxy-preview"></div>
              <div class="theme-info"><h4>2. Deep Space</h4></div>
            </div>

            <div class="theme-card" data-theme="lofi">
              <div class="theme-preview theme-lofi-preview"></div>
              <div class="theme-info"><h4>3. Cozy Rain</h4></div>
            </div>

            <div class="theme-card" data-theme="nature">
              <div class="theme-preview theme-nature-preview"></div>
              <div class="theme-info"><h4>4. Forest Breeze</h4></div>
            </div>

            <div class="theme-card" data-theme="synthwave">
              <div class="theme-preview theme-synthwave-preview"></div>
              <div class="theme-info"><h4>5. Retro Horizon</h4></div>
            </div>

            <div class="theme-card" data-theme="liquid">
              <div class="theme-preview theme-liquid-preview"></div>
              <div class="theme-info"><h4>6. Fluid Aurora</h4></div>
            </div>

            <!-- 3 NEW ANIMATIONS -->
            <div class="theme-card" data-theme="matrix">
              <div class="theme-preview theme-matrix-preview"></div>
              <div class="theme-info"><h4>7. Matrix Digital</h4></div>
            </div>

            <div class="theme-card" data-theme="fireflies">
              <div class="theme-preview theme-fireflies-preview"></div>
              <div class="theme-info"><h4>8. Midnight Glow</h4></div>
            </div>

            <div class="theme-card" data-theme="waves">
              <div class="theme-preview theme-waves-preview"></div>
              <div class="theme-info"><h4>9. Sunset Wave</h4></div>
            </div>
          </div>

          <div class="theme-settings-panel">
            <div class="setting-item">
              <label for="speed-slider">Speed</label>
              <input type="range" id="speed-slider" min="1" max="10" value="5">
            </div>
            <div class="setting-item">
              <label for="darken-slider">Darkness</label>
              <input type="range" id="darken-slider" min="0" max="90" value="40">
            </div>
          </div>
        </div>

        <!-- TAB 2: Audio Ambience Mixer -->
        <div class="master-tab-content" id="tab-audio">
          <div class="audio-track-list">
            <div class="audio-track-item">
              <div class="track-info"><i class="fa-solid fa-cloud-showers-heavy"></i> <span>Rain</span></div>
              <input type="range" class="audio-track-vol" data-track="rain" min="0" max="100" value="0">
            </div>
            <div class="audio-track-item">
              <div class="track-info"><i class="fa-solid fa-water"></i> <span>Waves</span></div>
              <input type="range" class="audio-track-vol" data-track="waves" min="0" max="100" value="0">
            </div>
            <div class="audio-track-item">
              <div class="track-info"><i class="fa-solid fa-tree"></i> <span>Forest</span></div>
              <input type="range" class="audio-track-vol" data-track="forest" min="0" max="100" value="0">
            </div>
            <div class="audio-track-item">
              <div class="track-info"><i class="fa-solid fa-wind"></i> <span>White Noise</span></div>
              <input type="range" class="audio-track-vol" data-track="space" min="0" max="100" value="0">
            </div>
          </div>
        </div>

        <!-- TAB 3: Timer Durations Config -->
        <div class="master-tab-content" id="tab-timer">
          <div class="settings-group">
            <div class="duration-inputs">
              <div class="input-field">
                <label>Focus (Min)</label>
                <input type="number" id="setting-pomo-time" min="1" max="120" value="25">
              </div>
              <div class="input-field">
                <label>Short Break (Min)</label>
                <input type="number" id="setting-short-break" min="1" max="60" value="5">
              </div>
              <div class="input-field">
                <label>Long Break (Min)</label>
                <input type="number" id="setting-long-break" min="1" max="60" value="15">
              </div>
            </div>
          </div>

          <button class="btn-primary-action" id="btn-save-settings">Save</button>
        </div>

      </div>
    </div>
  </div>

  <!-- JS Core Engine -->
  <script src="app.js"></script>
</body>
</html>
